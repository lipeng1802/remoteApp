# Additive server block; existing 443 sites are not changed.
map $http_upgrade $remoteapp_poc_connection {
    default upgrade;
    '' close;
}
server {
    listen 8443 ssl;
    server_name mk.fengmap.com;
    ssl_certificate /fm_inetpub/software/nginx/ssl/6210186__fengmap.com.pem;
    ssl_certificate_key /fm_inetpub/software/nginx/ssl/6210186__fengmap.com.key;
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE+AESGCM;
    server_tokens off;
    access_log off;
    client_max_body_size 1m;
    # No public administration, metrics, debugging or browser registration.
    location ~ ^/(api|swagger|metrics|debug|register)(/|$) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $remoteapp_poc_connection;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
